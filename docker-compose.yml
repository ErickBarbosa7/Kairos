services:
  db:
    image: postgres:17-alpine
    container_name: kairos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos_dev}
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - kairos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kairos} -d ${POSTGRES_DB:-kairos}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kairos_pgdata:
